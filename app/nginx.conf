server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3979;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;

        # El default de nginx (60s) cortaba /task/execute/:taskId antes de que
        # el backend terminara transferencias grandes, aunque siguiera
        # trabajando de fondo (ver hallazgo de arquitectura sobre este mismo
        # endpoint: es síncrono, no hay forma de saber cuánto puede tardar).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
