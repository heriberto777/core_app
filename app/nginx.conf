server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE de progreso de tareas (server/services/progressSse.js) — necesita su
    # propio location porque el streaming se cortaba a medias (intermitente,
    # NS_ERROR_NET_PARTIAL_TRANSFER): con el buffering por defecto de nginx los
    # write() periódicos del backend (incluido el keepalive cada 30s) quedaban
    # retenidos en el buffer en vez de reenviarse de inmediato.
    location /api/v1/transfer/progress/ {
        proxy_pass http://backend:3979;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 24h;
    }

    location /api/ {
        proxy_pass http://backend:3979;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;

        # El default de nginx (60s) cortaba /task/execute/:taskId antes de que
        # el backend terminara transferencias grandes, aunque siguiera
        # trabajando de fondo (ver hallazgo de arquitectura sobre este mismo
        # endpoint: es síncrono, no hay forma de saber cuánto puede tardar).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # El default de nginx (1m) rechazaba con un 413 HTML (antes de llegar
        # a Express, que acepta hasta 50mb vía MAX_REQUEST_SIZE) el guardado de
        # mappings grandes -- ej. CargarFacturaCompleta, 14 tableConfigs con
        # SQL largo en lookupQuery, supera 1MB en JSON. El frontend intentaba
        # parsear esa página HTML como JSON sin chequear el status, resultando
        # en "SyntaxError: JSON.parse: unexpected character at line 1 column 1".
        client_max_body_size 10m;
    }
}
